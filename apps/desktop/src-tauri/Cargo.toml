[package]
name = "latido"
version = "0.2.2"
description = "Latido — el pulso de internet, local-first"
authors = ["smouj <smouj@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
repository = "https://github.com/smouj/latido"
homepage = "https://github.com/smouj/latido"
default-run = "latido"

[lib]
name = "latido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
keyring = "3.6.3"
latido-chrome-session = { path = "crates/latido-chrome-session" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-plugin-http = "2.6.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
