name: Error
description: Algo de Latido no funciona como debería.
title: '[Error] '
labels: ['error']
body:
  - type: markdown
    attributes:
      value: |
        Antes de nada: busca en los issues existentes, puede estar ya reportado.

        Si el fallo es de seguridad, **no lo abras aquí**: sigue `docs/SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Versión de Latido
      description: Aparece en Ajustes → Acerca de, o en el nombre del paquete instalado.
      placeholder: '0.1.0'
    validations:
      required: true

  - type: dropdown
    id: plataforma
    attributes:
      label: Sistema y forma de uso
      description: Cómo estás ejecutando Latido.
      options:
        - Escritorio · Linux (.deb)
        - Escritorio · Linux (AppImage)
        - Escritorio · Windows (instalador)
        - Escritorio · macOS (.dmg)
        - Navegador (pnpm dev / build web)
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: Versión del sistema
      description: Distribución y versión, o versión de Windows/macOS, y la del navegador si aplica.
      placeholder: 'Ubuntu 22.04, GNOME 42 / Windows 11 23H2 / macOS 14.5 / Firefox 128'
    validations:
      required: true

  - type: dropdown
    id: fuente
    attributes:
      label: Fuente implicada
      description: Marca la red que estaba activa cuando ocurrió. Elige «No aplica» si el fallo es de interfaz o del motor.
      options:
        - No aplica (interfaz, motor o aplicación)
        - Hacker News
        - Bluesky
        - Reddit
        - Mastodon
        - RSS / Atom
        - GitHub
        - Varias fuentes
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Qué hiciste, en orden, desde que abriste Latido.
      placeholder: |
        1. Abrir Fuentes y activar RSS con https://example.com/feed.xml
        2. Pulsar «Sondear ahora»
        3. Abrir Radar
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
      placeholder: Los temas del feed aparecen agrupados en Radar.
    validations:
      required: true

  - type: textarea
    id: obtenido
    attributes:
      label: Qué ocurrió
      placeholder: 'Radar sigue vacío y en Fuentes aparece «Error: HTTP 403».'
    validations:
      required: true

  - type: textarea
    id: registros
    attributes:
      label: Registros
      description: |
        Escritorio: salida de la consola del WebView (menú contextual → Inspeccionar) y errores de la fuente tal cual aparecen en Fuentes.
        Navegador: consola de desarrollo.
        Pega el texto, no capturas de la consola.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones
      options:
        - label: He probado con la última versión publicada.
          required: false
        - label: No incluyo tokens, claves ni datos personales en este informe.
          required: true
