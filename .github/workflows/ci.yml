name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Tipos, tests y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construir los tokens de diseño
        run: pnpm --filter @latido/tokens build
      - name: Comprobar que los tokens son deterministas
        run: |
          cp packages/tokens/dist/tokens.css /tmp/tokens-a.css
          cp packages/tokens/dist/tokens.json /tmp/tokens-a.json
          pnpm --filter @latido/tokens build
          diff -u /tmp/tokens-a.css packages/tokens/dist/tokens.css
          diff -u /tmp/tokens-a.json packages/tokens/dist/tokens.json
      - name: Tipos
        run: pnpm -r typecheck
      - name: Tests del motor
        run: pnpm --filter @latido/engine test
      - name: Compilar la interfaz
        run: pnpm --filter @latido/app build

  node-matrix:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @latido/tokens build
      - run: pnpm --filter @latido/engine test

  desktop:
    name: Escritorio (Rust)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema para Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Comprobar el shell sin empaquetar
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
