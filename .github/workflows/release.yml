name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Compilar y publicar (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            args: ''
          - os: windows-latest
            label: Windows
            args: ''
          - os: macos-latest
            label: macOS
            args: '--target universal-apple-darwin'
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v6  # la versión sale de packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Comprobar antes de empaquetar
        run: |
          pnpm --filter @latido/tokens build
          pnpm -r typecheck
          pnpm --filter @latido/engine test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Latido ${{ github.ref_name }}'
          releaseBody: |
            Descarga el instalador de tu sistema y ejecútalo. No hay cuenta ni
            configuración: la app arranca con datos de ejemplo y activas tus
            fuentes en **Fuentes**.

            Comprobación de integridad (Linux/macOS):

            ```bash
            sha256sum -c latido-*.sha256 2>/dev/null || shasum -a 256 -c *.sha256
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          fail-on-unmatched-files: true
